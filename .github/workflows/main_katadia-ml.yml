# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - katadia-ml

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Build once in GitHub Actions, then deploy pre-built venv to Azure
      # This saves 10-15 minutes by skipping Azure Oryx rebuild
      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
      # Create .skipPythonDeployment to tell Azure: "Don't rebuild, use my venv"
      - name: Disable Azure rebuild (use pre-built venv)
        run: |
          touch .skipPythonDeployment
          echo "Using pre-built venv from GitHub Actions" > .skipPythonDeployment
                
      # Include antenv in artifact (pre-built dependencies)
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !.github/
            !datasets/
            !models/
            !tests/
            !*.md

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_35B019A4652647B0AC22F4A2A2744D67 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ABA147B210A3498EA337B33C3C777BCF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DA2C8B8A89F44DEBB817F77163B6EFAF }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'katadia-ml'
          slot-name: 'Production'
          startup-command: 'gunicorn --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 600 wsgi:app'
          